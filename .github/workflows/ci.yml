name: CI

on:
  push:
    branches: [master]
  pull_request:

# a newer push cancels the still-running/queued CI of the same branch,
# so force-pushes don't stack redundant runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    # mirrors the sniffs WordPress.org Plugin Check runs (EscapeOutput,
    # PrefixAllGlobals) so submission issues are caught before upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache composer tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.composer/vendor
            ~/.composer/composer.json
          key: ${{ runner.os }}-wpcs-v1

      - name: "PHPCS (WPCS: EscapeOutput + PrefixAllGlobals)"
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require squizlabs/php_codesniffer wp-coding-standards/wpcs --no-interaction
          phpcs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.2', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        run: |
          php -l yac-ocache.php
          php -l object-cache.php

      - name: Drop-in smoke test (runtime-only fallback)
        run: php -n tests/smoke.php

      # Both stub WordPress and need no extension, so they run across the whole
      # PHP matrix. render.php stays out: it is 104/4 without yac, since
      # YAC_VERSION alone drives the dump() feature gates it asserts on.
      - name: Plugin shell test (deploy/status)
        run: php -n tests/shell.php

      - name: WP-CLI subcommand test (drop-in deploy/update/remove)
        run: php -n tests/cli.php

  test-yac:
    # exercises the shared-memory path against two extension versions: the
    # current upstream release, and 2.3.2, the oldest version the drop-in is
    # tested against. 2.3.2 has no entry metadata in dump() and its dump()
    # takes no offset, so that leg proves the >= 2.4.0 feature gates degrade
    # instead of failing, while the latest leg is the only thing that runs
    # the non-degraded branch. PHP stays at 8.5 in both legs so the
    # extension version is the only variable.
    #
    # Both legs install with PIE, not setup-php's `extensions: yac`: on
    # Linux that resolves to the sury/ondrej deb (php8.5-yac 2.3.1++-5),
    # which is pinned at 2.3.1 and never tracked PECL -- so the leg that
    # was named "PECL latest" had in fact been testing 2.3.1 all along, and
    # 2.4.x had never run in CI. PIE resolves through Packagist instead,
    # where an unconstrained laruence/yac gives the newest release.
    #
    # 2.3.2 is the floor because PIE reads composer.json, which yac gained
    # at 2.3.2; 2.3.1 is not installable this way and is not on Packagist.
    #
    # smoke.php requires object-cache.php only, so the coverage here is the
    # drop-in plus smoke's own dump probe. The admin-side gates in
    # yac-ocache.php (yac_ocache_dump_all, yac_ocache_dump_entry) are not
    # reached: not by this job, and not by the Live WordPress one either,
    # which only calls status/self_test/storage_info. tests/render.php does
    # cover them, with fakes for both dump() shapes, but no workflow runs
    # it. Wiring it up needs no extension at all -- it fakes the Yac object
    # but not YAC_VERSION, and that constant alone drives the gates: with
    # YAC_VERSION undefined or < 2.4.0 it is 104/4, with it >= 2.4.0 it is
    # 108/0, extension loaded or not.
    name: test-yac (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # unpinned: tracks whatever laruence/yac releases next
          - { label: 'latest', pkg: 'laruence/yac', min: '2.4.0', expect: '' }
          - { label: '2.3.2', pkg: 'laruence/yac:2.3.2', min: '', expect: '2.3.2' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: pie
          coverage: none

      - name: Install yac with PIE
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          # sudo to write the extension dir and conf.d, --with-php-config to
          # pin the target: sudo resets PATH, so PIE would otherwise probe
          # whichever php it finds rather than the one set up above
          sudo "$(command -v pie)" install "$PKG" \
            --no-interaction --with-php-config="$(command -v php-config)"

      - name: Show the yac version under test
        env:
          WANT: ${{ matrix.expect }}
          MIN: ${{ matrix.min }}
        run: |
          GOT=$(php -r 'echo (string) phpversion( "yac" );')
          export GOT
          echo "yac ${GOT:-<not loaded>}"
          # smoke.php passes without the extension (that is the runtime-only
          # fallback the test job covers), so a failed load here would look
          # green while testing nothing
          if [ -z "$GOT" ]; then
            echo "::error::the yac extension is not loaded"
            exit 1
          fi
          # the pinned leg must stay pinned, or it silently becomes a
          # duplicate of the latest one
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "::error::expected yac $WANT, got $GOT"
            exit 1
          fi
          # and the latest leg must stay above the feature-gate boundary,
          # or every dump() assertion silently skips -- which is exactly how
          # the sury deb went unnoticed at 2.3.1
          if [ -n "$MIN" ] && \
             ! php -r 'exit( version_compare( getenv( "GOT" ), getenv( "MIN" ), ">=" ) ? 0 : 1 );'; then
            echo "::error::expected yac >= $MIN, got $GOT"
            exit 1
          fi

      - name: Syntax check
        run: |
          php -l yac-ocache.php
          php -l object-cache.php

      - name: Drop-in smoke test (shared memory)
        run: php -d yac.enable_cli=1 tests/smoke.php

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build release zip
        run: bash scripts/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yac-obj-cache
          path: dist/yac-obj-cache.zip
