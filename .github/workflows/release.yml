name: Release

on:
  # Fires when a release is created/published on GitHub (web UI or API),
  # so the flow is: push commits -> create the release -> zip gets uploaded.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build from the tag the release points at, not the default branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build release zip
        run: bash scripts/build-release.sh

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: dist/yac-obj-cache.zip
          fail_on_unmatched_files: true
