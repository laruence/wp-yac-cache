name: Live WordPress

# Real end-to-end test: boot a real WordPress against MySQL with the yac
# extension, let plugin activation deploy the drop-in, then run
# tests/live-wp-debug.php from the WP root. The smoke test mocks the WP
# functions; this one exercises the real boot + drop-in load path.

on:
  push:
    branches: [master]
  pull_request:

# a newer push cancels the still-running/queued CI of the same branch,
# so force-pushes don't stack redundant runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-wp:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          tools: wp-cli, pie
          coverage: none

      # yac comes from PIE, not from setup-php's `extensions: yac`: on Linux
      # that resolves to the sury/ondrej deb (php8.5-yac 2.3.1++-5), pinned
      # at 2.3.1, so this workflow had been booting WordPress against an
      # extension four releases behind. PIE resolves through Packagist,
      # where an unconstrained laruence/yac gives the newest release.
      - name: Install yac with PIE
        run: |
          # sudo to write the extension dir and conf.d, --with-php-config to
          # pin the target: sudo resets PATH, so PIE would otherwise probe
          # whichever php it finds rather than the one set up above
          sudo "$(command -v pie)" install laruence/yac \
            --no-interaction --with-php-config="$(command -v php-config)"

      - name: Show the yac version under test
        env:
          MIN: '2.4.0'
        run: |
          GOT=$(php -r 'echo (string) phpversion( "yac" );')
          export GOT
          echo "yac ${GOT:-<not loaded>}"
          # the drop-in falls back to a runtime-only cache with no extension,
          # so a failed load would still boot WordPress and look green while
          # never touching shared memory
          if [ -z "$GOT" ]; then
            echo "::error::the yac extension is not loaded"
            exit 1
          fi
          if ! php -r 'exit( version_compare( getenv( "GOT" ), getenv( "MIN" ), ">=" ) ? 0 : 1 );'; then
            echo "::error::expected yac >= $MIN, got $GOT"
            exit 1
          fi

      - name: Install WordPress
        run: |
          wp core download --path=/tmp/wp --version=latest
          cd /tmp/wp
          wp config create \
            --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 \
            --extra-php <<'EOF'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' );
          EOF
          # WP_CACHE is deliberately NOT defined: wp_start_object_cache() loads
          # wp-content/object-cache.php without it, so this run proves the
          # plugin needs no wp-config edit at all.
          wp core install \
            --url=http://localhost --title="Live Test" \
            --admin_user=admin --admin_password=admin \
            --admin_email=admin@example.com --skip-email

      - name: Install and activate the plugin
        run: |
          # the release zip has no top-level directory
          bash scripts/build-release.sh /tmp/yac-obj-cache.zip
          mkdir -p /tmp/wp/wp-content/plugins/yac-ocache
          unzip -o /tmp/yac-obj-cache.zip -d /tmp/wp/wp-content/plugins/yac-ocache
          cd /tmp/wp
          # activation deploys the object-cache.php drop-in
          wp plugin activate yac-ocache
          test -f /tmp/wp/wp-content/object-cache.php

      - name: Run Plugin Check
        run: |
          cd /tmp/wp
          wp plugin install plugin-check --activate
          wp plugin check yac-ocache --format=table \
            --require=wp-content/plugins/plugin-check/cli.php

      # tests/cli.php stubs the WP_CLI class, so it can assert the @subcommand
      # tags are present but not that WP-CLI honours them. Only a real wp run
      # proves the registration, and the stale-drop-in scenario this covers is
      # exactly what `wp plugin update` leaves behind.
      - name: Exercise the WP-CLI drop-in commands
        run: |
          cd /tmp/wp
          DROPIN=/tmp/wp/wp-content/object-cache.php
          SRC=/tmp/wp/wp-content/plugins/yac-ocache/object-cache.php

          # WP-CLI does not derive "update-dropin" from update_dropin(): the
          # hyphenated name comes from the @subcommand tag. Without it these
          # register as "wp yac update_dropin" and every doc line is a lie.
          # a bare parent command only prints usage; don't depend on its exit
          # code, the greps below are the actual assertion
          wp yac > /tmp/yac-usage.txt 2>&1 || true
          cat /tmp/yac-usage.txt
          for sub in status flush deploy-dropin update-dropin remove-dropin; do
            grep -q "wp yac $sub" /tmp/yac-usage.txt \
              || { echo "::error::wp yac $sub is not registered"; exit 1; }
          done

          wp yac status

          # Age the deployed copy: this is the state `wp plugin update` leaves,
          # since it replaces the plugin but never rewrites wp-content.
          sed -i "s/YAC_OCACHE_DROPIN_VERSION', '[^']*'/YAC_OCACHE_DROPIN_VERSION', '0.9.0'/" "$DROPIN"
          wp yac status | tee /tmp/yac-stale.txt
          grep -q 'deployed v0.9.0' /tmp/yac-stale.txt \
            || { echo "::error::status does not report the stale drop-in"; exit 1; }
          grep -q 'wp yac update-dropin' /tmp/yac-stale.txt \
            || { echo "::error::status does not point CLI users at update-dropin"; exit 1; }

          wp yac update-dropin
          # a plain copy, so the deployed file must be byte-identical again
          diff -q "$SRC" "$DROPIN"
          wp yac status | grep -q 'up to date' \
            || { echo "::error::status still reports a stale drop-in"; exit 1; }

          wp yac remove-dropin --yes
          test ! -f "$DROPIN"
          wp yac status | grep -q 'drop-in is missing' \
            || { echo "::error::status does not report the missing drop-in"; exit 1; }

          wp yac deploy-dropin
          diff -q "$SRC" "$DROPIN"

          # A drop-in owned by another cache plugin is never overwritten or
          # deleted. WordPress falls back to core's cache when object-cache.php
          # defines no wp_cache_init, so this stub still boots WP-CLI.
          mv "$DROPIN" /tmp/yac-ours.php
          printf '%s\n' '<?php' '// foreign object cache, not Yac' > "$DROPIN"
          if wp yac deploy-dropin; then
            echo "::error::deploy-dropin did not refuse a foreign drop-in"; exit 1
          fi
          if wp yac remove-dropin --yes; then
            echo "::error::remove-dropin did not refuse a foreign drop-in"; exit 1
          fi
          grep -q 'foreign object cache' "$DROPIN" \
            || { echo "::error::the foreign drop-in was modified"; exit 1; }

          # restore ours: the live debug test below asserts dropin_version is ok
          mv /tmp/yac-ours.php "$DROPIN"
          wp yac status

      - name: Run the live debug test
        run: |
          cd /tmp/wp
          php -d yac.enable_cli=1 -d display_errors=0 \
              -d log_errors=1 -d error_log=/tmp/wp-yac-test.log \
              "$GITHUB_WORKSPACE/tests/live-wp-debug.php"
